/* =================================================================
   PROGRESS
   A review of the day, week or month: XP earned against the pace the
   target asks for, what went well, and what slipped - said kindly,
   but said.
================================================================== */
const paceNeedPerDay=()=>{const span=dayDiff(state.start,state.deadline);return span>0?state.target/span:0;};
const xpBetween=(a,b)=>state.log.filter(e=>e.date>=a&&e.date<=b).reduce((s,e)=>s+e.xp,0);
const monthStart=iso=>iso.slice(0,8)+'01';
const monthEnd=iso=>{const d=parseLocal(iso);return localISO(new Date(d.getFullYear(),d.getMonth()+1,0));};

// XP per day as bars, the day's pace need as a dashed line across them
function progressBarsSVG(from,end,perDay){
  const t=todayISO();
  const days=[]; for(let d=from;d<=end;d=addDays(d,1)) days.push(d);
  const W=340,H=112,B=18,T=8;
  const vals=days.map(d=>d<=t?xpOn(d):null);
  const top=Math.max(perDay*1.25,...vals.map(v=>v||0),10);
  const y=v=>T+(1-v/top)*(H-T-B);
  const bw=Math.max(3,(W-8)/days.length-2.5);
  let s='';
  days.forEach((d,i)=>{
    const x=(4+i*((W-8)/days.length)).toFixed(1);
    if(vals[i]===null){ s+=`<rect x="${x}" y="${H-B-1.5}" width="${bw.toFixed(1)}" height="1.5" rx="0.75" style="fill:var(--line-2)"/>`; return; }
    const v=Math.max(0,vals[i]);       // a penalty day draws as empty, not upside down
    const h=Math.max(v>0?3:1.5,(H-T-B)*v/top);
    s+=`<rect x="${x}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:${d===t?'var(--gold)':'var(--accent)'}"/>`;
  });
  if(perDay>0){
    s+=`<line x1="2" y1="${y(perDay).toFixed(1)}" x2="${W-2}" y2="${y(perDay).toFixed(1)}" style="stroke:var(--green)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".8"/>`+
       `<text x="${W-4}" y="${(y(perDay)-4).toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="600" style="fill:var(--green)">pace ${Math.round(perDay)}/day</text>`;
  }
  const lab=(i,anchor)=>{const d=parseLocal(days[i]);return `<text x="${(4+i*((W-8)/days.length)+bw/2).toFixed(1)}" y="${H-5}" text-anchor="${anchor}" font-size="9.5" style="fill:var(--muted)">${days.length===7?['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]:d.getDate()}</text>`;};
  if(days.length===7) for(let i=0;i<7;i++) s+=lab(i,'middle');
  else{ s+=lab(0,'start'); s+=lab(Math.floor(days.length/2),'middle'); s+=lab(days.length-1,'end'); }
  return `<div class="wchart"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XP per day">${s}</svg></div>`;
}

function viewProgress(){
  const t=todayISO();
  const perDay=paceNeedPerDay();
  const kind=prog;
  const from=kind==='day'?t:kind==='week'?weekStart(t):monthStart(t);
  const end=kind==='day'?t:kind==='week'?addDays(weekStart(t),6):monthEnd(t);
  const label=kind==='day'?'today':kind==='week'?'this week':'this month';
  const daysIn=dayDiff(from,t)+1;                 // elapsed days incl. today
  const earned=xpBetween(from,t);
  const need=Math.round(perDay*daysIn);

  // ---- headline + verdict ----
  const xp=totalXP();
  const daysLeftAll=Math.max(0,dayDiff(t,state.deadline));
  const perDayCatch=daysLeftAll>0?Math.ceil(Math.max(0,state.target-xp)/daysLeftAll):0;
  let say;
  if(perDay<=0) say='Set the target and deadline under Settings and this page will measure you against them.';
  else if(xp>=state.target) say='<b>Target reached.</b> Everything from here is a victory lap - set a new one under Settings when ready.';
  else{
    const diff=earned-need;
    if(diff>=0) say=`That is <b>${fmt(diff)} XP ahead</b> of the pace your target asks for. Keep this up and the ${fmt(state.target)} lands early.`;
    else say=`That is <b>${fmt(-diff)} XP short</b> of pace ${label} - no drama. From today, about <b>${fmt(perDayCatch)} XP a day</b> still lands the target by ${esc(fmtShort(state.deadline))}.`;
  }

  // ---- previous period comparison ----
  let prevLine='';
  if(kind==='day'){const v=xpOn(addDays(t,-1)); prevLine=`Yesterday: ${fmt(v)} XP.`;}
  else if(kind==='week'){const pf=addDays(from,-7); const v=xpBetween(pf,addDays(from,-1)); prevLine=`Last week: ${fmt(v)} XP${v?earned>=v?' - matched or beaten already.':'':''}`;}
  else{const pm=monthStart(addDays(from,-1)); const v=xpBetween(pm,addDays(from,-1)); prevLine=`Last month: ${fmt(v)} XP.`;}

  // ---- wins ----
  const wins=[];
  const inRange=e=>e.date>=from&&e.date<=t;
  const doneGoals=state.log.filter(e=>e.type==='goal'&&inRange(e));
  doneGoals.forEach(e=>wins.push(`Objective done: <b>${esc(e.name)}</b> (+${fmt(e.xp)})`));
  const bonuses=state.log.filter(e=>e.type==='bonus'&&inRange(e));
  bonuses.forEach(e=>wins.push(`Weekly target hit: <b>${esc(e.name)}</b> (+${fmt(e.xp)})`));
  if(kind!=='day'){
    let best=0,bestD=null;
    for(let d=from;d<=t;d=addDays(d,1)){const v=xpOn(d);if(v>best){best=v;bestD=d;}}
    if(bestD&&best>0) wins.push(`Best day: <b>${esc(fmtShort(bestD))}</b>, ${fmt(best)} XP`);
    const s=streak(); if(s>=3) wins.push(`<b>${s}-day</b> logging streak`);
    const w=weightWeeks(); if(w.length>=2&&state.weight.goal!==null){
      const a=w[w.length-1],b=w[w.length-2];
      if(Math.abs(a.avg-state.weight.goal)<Math.abs(b.avg-state.weight.goal))
        wins.push(`Weight moving the right way: <b>${fmtKg(a.avg)} kg</b> this week`);
    }
  }

  // ---- worth watching ----
  const watch=[];
  const missEnd=addDays(t,-1);                    // today is not "missed" yet
  if(kind==='day'){
    const p=pendingToday();
    [...p.tasks,...p.habits].slice(0,5).forEach(x=>watch.push(`Still open today: <b>${esc(x.name)}</b>`));
    p.overdue.slice(0,3).forEach(x=>watch.push(`Carried over: <b>${esc(x.name)}</b>, set for ${esc(fmtShort(x.date))}`));
  }else{
    state.habits.filter(h=>h.mode==='daily').forEach(h=>{
      let missed=0;
      for(let d=from;d<=missEnd;d=addDays(d,1)) if(!loggedOn(h.id,d).length) missed++;
      if(missed>0) watch.push(`<b>${esc(h.name)}</b>: missed ${missed} day${missed===1?'':'s'} ${label} - one tap tomorrow restarts it`);
    });
    state.habits.filter(h=>h.mode==='weekly').forEach(h=>{
      if(kind==='week'){
        const left=weeklyLeft(h,t);
        if(left>0) watch.push(`<b>${esc(h.name)}</b>: ${weekCount(h.id,t)} of ${h.perWeek} so far - ${left} more by Sunday keeps the bonus`);
      }else{
        let weeks=0,hit=0;
        for(let w=weekStart(from)<from?addDays(weekStart(from),7):weekStart(from); addDays(w,6)<=missEnd; w=addDays(w,7)){
          weeks++; if(weekCount(h.id,w)>=h.perWeek) hit++;
        }
        if(weeks>0&&hit<weeks) watch.push(`<b>${esc(h.name)}</b>: hit ${hit} of ${weeks} full week${weeks===1?'':'s'} ${label}`);
      }
    });
    state.log.filter(e=>e.type==='penalty'&&inRange(e)).forEach(e=>
      watch.push(`<b>Level lost</b> on ${esc(fmtShort(e.date))}: two days with nothing logged (${fmt(e.xp)} XP)`));
    const missedTasks=state.tasks.filter(x=>!x.done&&x.date>=from&&x.date<=missEnd);
    if(missedTasks.length) watch.push(`<b>${missedTasks.length} daily goal${missedTasks.length===1?'':'s'}</b> still unfinished: ${missedTasks.slice(0,3).map(x=>esc(x.name)).join(', ')}${missedTasks.length>3?'&hellip;':''} - waiting under Tasks`);
  }

  const item=(cls,html)=>`<div class="pitem ${cls}"><span class="pdot"></span><div>${html}</div></div>`;
  return `<div class="seg">${[['day','Day'],['week','Week'],['month','Month']].map(p=>
      `<button data-act="prog" data-id="${p[0]}" aria-pressed="${prog===p[0]}">${p[1]}</button>`).join('')}</div>
    <div class="wcard">
      <div class="prognum num">${fmt(earned)}<span> XP ${label}</span></div>
      <div class="proglab num">${perDay>0?`Pace so far asks for about ${fmt(need)}. ${prevLine}`:prevLine}</div>
      <div class="progsay">${say}</div>
      ${kind==='day'?'':progressBarsSVG(from,end,perDay)}
    </div>
    <h2>Went well</h2>
    ${wins.length?wins.map(w=>item('win',w)).join(''):item('','Nothing logged yet '+label+'. The first tap is the hardest one.')}
    <h2>Worth watching</h2>
    ${watch.length?watch.map(w=>item('watch',w)).join(''):item('win','Nothing slipped '+label+'. Clean sheet.')}`;
}

function viewSettings(){
  return `<div class="form"><h3>Target</h3>
      <div class="field"><label for="f-target">XP goal</label><input id="f-target" type="number" inputmode="numeric" min="1" step="1" value="${state.target}"></div>
      <div class="two">
        <div class="field"><label for="f-start">Counting from</label><input id="f-start" type="date" value="${state.start}"></div>
        <div class="field"><label for="f-deadline">Deadline</label><input id="f-deadline" type="date" value="${state.deadline}"></div>
      </div>
      <button class="btn primary" data-act="save-target">Save target</button>
    </div>
    <div class="form"><h3>Level penalty</h3>
      <div class="toggle"><label for="f-penalty">Two quiet days in a row cost a level</label><input type="checkbox" id="f-penalty" ${state.penaltyPaused?'':'checked'}></div>
      <div class="note ${state.penaltyPaused?'warn':''}">${state.penaltyPaused
        ?'Paused. Quiet days are not being judged and never will be for this stretch - switching back on starts counting from that day, with no back-charges.'
        :'Miss two days in a row without logging anything and a level goes: your total drops to the start of the previous level, shown in red on the calendar. Backfilling a forgotten habit onto those days takes it back. Pause this for exam weeks or holidays.'}</div>
    </div>
    <div class="form"><h3>Weight goal</h3>
      <div class="field"><label for="f-w-goal">Goal weight (kg)</label><input id="f-w-goal" inputmode="decimal" value="${state.weight.goal!==null?fmtKg(state.weight.goal):''}" placeholder="70.0" autocomplete="off"></div>
      <button class="btn primary" data-act="wt-goal">Save goal</button>
      <div style="font-size:12.5px;color:var(--muted);margin-top:8px">Weight earns no XP: log it on Home each morning and the chart there follows each week's average. Save with the field empty to take the goal line off the chart.${state.weight.entries.length?' '+state.weight.entries.length+' morning'+(state.weight.entries.length===1?'':'s')+' logged so far.':''}</div>
    </div>
    <div class="form"><h3>Appearance</h3>
      <div class="seg" style="margin-bottom:0">
        ${[['auto','Auto'],['light','Light'],['dark','Dark']].map(t=>
          `<button data-act="theme" data-id="${t[0]}" aria-pressed="${state.theme===t[0]}">${t[1]}</button>`).join('')}
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:8px">Auto follows the phone's own light or dark setting. Currently showing ${effectiveTheme()}.</div>
    </div>
    <div class="form"><h3>Reminders</h3>
      <div class="toggle"><label for="f-badge">Show how many things are left on the app icon</label><input type="checkbox" id="f-badge" ${state.reminders.badge?'checked':''}></div>
      <div class="note" style="margin-bottom:12px">The app cannot send notifications by itself: iPhone web apps only receive them from a server, and this one has none. The icon badge above works without one. For alerts at set times, use the Shortcuts steps below with your chosen times.</div>
      <label style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px">Reminder times</label>
      <div class="timelist">${state.reminders.times.length?state.reminders.times.map(x=>`<span class="timechip">${x}<button data-act="rem-del" data-id="${x}" aria-label="Remove ${x}">&times;</button></span>`).join(''):'<span style="font-size:13px;color:var(--muted)">None set.</span>'}</div>
      <div class="two"><div class="field" style="margin:0"><input type="time" id="f-rem-time" value="15:00"></div><button class="btn ghost" data-act="rem-add" style="flex:0 0 auto;width:auto;padding:0 18px">Add time</button></div>
      <ol class="steps" style="margin-top:14px">
        <li>Open the iPhone <b>Shortcuts</b> app, tap <b>Automation</b>, then <b>+</b>.</li>
        <li>Choose <b>Time of Day</b>, set <b>${state.reminders.times[0]||'15:00'}</b>, repeat <b>Daily</b>, and pick <b>Run Immediately</b>.</li>
        <li>Add the action <b>Show Notification</b> with the text: <i>Level: check what's still left today.</i> If <b>Open App</b> lists Level, use that instead.</li>
        <li>Repeat for ${state.reminders.times.length>1?state.reminders.times.slice(1).join(' and '):'any other time'}.</li>
      </ol>
      <div style="font-size:12.5px;color:var(--muted);margin-top:8px">When you open the app after one of these times, the home screen shows what's still pending.</div>
    </div>
    <div class="form"><h3>Your data</h3>
      <div class="note ${persists?'':'warn'}" style="margin-bottom:10px">${persists
        ?'Everything is stored on this device only and never leaves it. Deleting the app from the home screen deletes the data, so export a backup now and then.'
        :'This preview cannot save to the device, so entries vanish on reload. Once hosted at your own address it saves normally.'}</div>
      <div style="font-size:12.5px;color:${backupOverdue()?'var(--warn-ink)':'var(--muted)'};margin-bottom:10px">${
        state.lastBackup
          ?'Last backup '+esc(fmtShort(state.lastBackup))+', '+daysSinceBackup()+' day'+(daysSinceBackup()===1?'':'s')+' ago.'
          :'No backup exported yet.'}</div>
      <div class="inline"><button class="btn ghost" data-act="export">Export backup</button>
        <label class="btn ghost" style="cursor:pointer">Restore backup<input type="file" accept=".json,application/json" class="hidden" id="f-import"></label></div>
      <div class="inline"><button class="btn danger" data-act="reset">Reset everything</button></div>
    </div>
    <div class="note" style="margin-top:4px">Level curve: level 2 at 100 XP, level 5 at 700, level 10 at 2,700, level 20 at 10,450. Each level costs 50 XP more than the one before.</div>`;
}

/* =================================================================
   ROUTER + EVENTS
================================================================== */
function render(){
  document.getElementById('today').textContent=fmtLong(todayISO());
  const v={home:viewHome,tasks:viewTasks,sections:viewSections,calendar:viewCalendar,progress:viewProgress,settings:viewSettings}[tab]||viewHome;
  document.getElementById('view').innerHTML=v();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===tab?'true':'false'));
  updateBadge();
}

const ACTIONS={
  tab:id=>{tab=id;editing=null;adding=null;render();window.scrollTo(0,0);},
  prog:id=>{prog=id==='day'||id==='month'?id:'week';render();},
  'toggle-done':()=>{state.hideDone=!state.hideDone;save();render();},
  'go-tasks':()=>{tab='tasks';editing=null;adding=null;render();window.scrollTo(0,0);const el=document.getElementById('f-t-name');if(el)el.focus();},
  log:id=>logHabit(id),
  goal:id=>toggleGoal(id),
  undo:()=>undoLast(),
  'rm-entry':id=>removeEntry(id),
  pick:id=>{cal.sel=id;render();},
  'cal-prev':()=>{cal.m--;if(cal.m<0){cal.m=11;cal.y--;}render();},
  'cal-next':()=>{cal.m++;if(cal.m>11){cal.m=0;cal.y++;}render();},
  'log-day':iso=>{const sel=document.getElementById('f-cal-habit');if(sel&&sel.value)logHabit(sel.value,iso);},
  color:id=>{pickedColor=id;document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));},
  'add-cat':()=>{adding={type:'cat'};editing=null;pickedColor=PALETTE[0];render();focusForm('f-cat-name');},
  'add-habit':id=>{adding={type:'habit',cat:id};editing=null;render();focusForm('f-h-name');},
  'add-objective':id=>{adding={type:'goal',cat:id};editing=null;render();focusForm('f-g-name');},
  'save-cat':()=>saveCat(),
  'edit-cat':id=>{const c=state.cats.find(x=>x.id===id);if(!c)return;editing={type:'cat',id};adding=null;pickedColor=c.color;render();focusForm('f-cat-name');},
  'del-cat':id=>deleteCat(id),
  'save-habit':()=>saveHabit(),
  'edit-habit':id=>{editing={type:'habit',id};adding=null;render();focusForm('f-h-name');},
  'del-habit':id=>deleteHabit(id),
  'save-goal':()=>saveGoal(),
  'edit-goal':id=>{editing={type:'goal',id};adding=null;render();focusForm('f-g-name');},
  'del-goal':id=>deleteGoal(id),
  cancel:()=>{editing=null;adding=null;pickedColor=PALETTE[0];render();},
  'save-target':()=>saveTarget(),
  export:()=>exportData(),
  reset:()=>resetAll(),
  'task-add':iso=>addTask(iso),
  task:id=>toggleTask(id),
  'task-del':id=>deleteTask(id),
  'task-move':id=>moveTaskToToday(id),
  theme:v=>setTheme(v),
  'wt-log':()=>logWeight(todayISO(),(document.getElementById('f-wt')||{}).value),
  'wt-log-day':iso=>logWeight(iso,(document.getElementById('f-wt-day')||{}).value),
  'wt-del-day':iso=>removeWeight(iso),
  'wt-goal':()=>saveWeightGoal((document.getElementById('f-w-goal')||{}).value),
  'wt-goal-home':()=>saveWeightGoal((document.getElementById('f-w-goal-h')||{}).value),
  'rem-add':()=>addReminderTime(),
  'rem-del':v=>removeReminderTime(v)
};
function focusForm(id){const el=document.getElementById(id);if(el){el.scrollIntoView({block:'center'});}}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACTIONS[el.dataset.act]; if(!fn) return;
  e.preventDefault();
  fn(el.dataset.id,el);
});
document.addEventListener('change',e=>{
  if(!e.target) return;
  if(e.target.id==='f-import') importData(e.target);
  if(e.target.id==='f-badge') setBadgePref(e.target.checked);
  if(e.target.id==='f-penalty') setPenaltyPref(e.target.checked);
  // shown/hidden in place rather than re-rendering, so a half-typed name survives
  if(e.target.id==='f-h-mode'){
    const on=e.target.value==='weekly';
    ['f-h-weekly','f-h-weekly-note'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.classList.toggle('hidden',!on);
    });
  }
});
// rows are divs with role="button": make the keyboard behave like the tap
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target instanceof Element?e.target.closest('.row[role="button"]'):null;
  if(!el) return;
  e.preventDefault(); el.click();
});
// Enter in a form field triggers that form's primary button. A .wlog line is
// self-contained (the weight card can hold two of them), so it wins first.
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!(e.target instanceof HTMLInputElement)||e.target.type==='date') return;
  const line=e.target.closest('.wlog');
  const box=line||e.target.closest('.form,.quick');
  const btn=box&&box.querySelector(line?'.btn':'.btn.primary');
  if(btn){e.preventDefault();btn.click();}
});

// When the app comes back after midnight, "today" must move on.
let renderedDay=todayISO();
const penaltyToast=n=>toast(n===1?'Two quiet days — down a level':n+' levels lost to quiet days');
function checkDayRollover(){
  const t=todayISO();
  if(t!==renderedDay){
    const wasYesterday=cal.sel===renderedDay;
    renderedDay=t;
    if(wasYesterday) cal.sel=t;
    cal.y=new Date().getFullYear();cal.m=new Date().getMonth();
    const n=reconcilePenalties();
    if(n) lastLevel=levelInfo(totalXP()).level;
    render();
    if(n) penaltyToast(n);
  }
}
// The minute tick also lets the reminder banner appear on its own the moment
// a reminder time passes, instead of waiting for the next tap.
let lastTickHM=pad2(new Date().getHours())+':'+pad2(new Date().getMinutes());
function minuteTick(){
  checkDayRollover();
  const now=new Date(),hm=pad2(now.getHours())+':'+pad2(now.getMinutes());
  if(tab==='home'&&state.reminders.times.some(x=>x>lastTickHM&&x<=hm)) render();
  lastTickHM=hm;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDayRollover();else updateBadge();});
window.addEventListener('focus',checkDayRollover);
window.addEventListener('pageshow',checkDayRollover);
setInterval(minuteTick,60000);

applyTheme();
const bootPenalties=reconcilePenalties();
if(bootPenalties) lastLevel=levelInfo(totalXP()).level;
render();
if(bootPenalties) penaltyToast(bootPenalties);

if('serviceWorker' in navigator){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}
</script>
